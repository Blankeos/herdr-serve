name: Publish registries

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish (for example, v0.1.0)
        required: true
        type: string

concurrency:
  group: publish-registries-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and package versions
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          if [[ "$RELEASE_TAG" != v* || -z "$version" ]]; then
            echo "Expected a release tag like v0.1.0, got: $RELEASE_TAG"
            exit 1
          fi

          file_version="$(tr -d '[:space:]' < VERSION)"
          npm_version="$(node -p "require('./npm/package.json').version")"

          if [[ "$file_version" != "$version" ]]; then
            echo "VERSION ($file_version) does not match tag ($version)"
            exit 1
          fi

          if [[ "$npm_version" != "$version" ]]; then
            echo "npm/package.json version ($npm_version) does not match tag ($version)"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wait-for-binaries:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait for GitHub release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            herdr-serve-aarch64-apple-darwin.tar.xz
            herdr-serve-aarch64-unknown-linux-gnu.tar.xz
            herdr-serve-x86_64-apple-darwin.tar.xz
            herdr-serve-x86_64-unknown-linux-gnu.tar.xz
            herdr-serve-x86_64-pc-windows-msvc.zip
          )

          for attempt in {1..120}; do
            assets="$(gh release view "${{ needs.prepare.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --json assets \
              --jq '.assets[].name' 2>/dev/null || true)"
            missing=()

            for asset in "${expected_assets[@]}"; do
              if ! grep -Fxq "$asset" <<< "$assets"; then
                missing+=("$asset")
              fi
            done

            if (( ${#missing[@]} == 0 )); then
              echo "All GitHub release binaries are available"
              exit 0
            fi

            echo "Waiting for release assets (attempt ${attempt}/120): ${missing[*]}"
            sleep 15
          done

          echo "Timed out waiting for GitHub release binaries"
          exit 1

  publish-npm:
    needs: [prepare, wait-for-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm package
        working-directory: npm
        run: npm publish --access public --provenance
